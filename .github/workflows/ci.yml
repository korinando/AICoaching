# Checks every push and pull request (Week 7 Step 2). Two jobs run side by side; if either fails, the
# commit gets a red cross on GitHub.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run that's still going: only the latest result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this workflow only checks code, so it doesn't need permission to change anything.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    # A hanging test (it has happened) fails after 15 minutes instead of using up the free minutes.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # Postgres in a container next to the job, reached on localhost:5432. The tests create their own
    # throwaway databases on it (tests/db_utils.py).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ai_coach
        ports:
          - 5432:5432
        # The job waits until Postgres answers, so the tests don't start against a database that isn't up.
        options: >-
          --health-cmd "pg_isready -U coach -d ai_coach"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Settings the app requires. These are NOT secrets: they only open throwaway containers that exist
    # for this run, and the tests use a fake Gemini, so the key is never sent anywhere.
    env:
      DATABASE_URL: postgresql+psycopg://coach:ci-only-password@127.0.0.1:5432/ai_coach
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      GEMINI_API_KEY: ci-fake-key-tests-never-call-gemini
      S3_ENDPOINT_URL: http://127.0.0.1:8333
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key-for-throwaway-storage

    steps:
      - uses: actions/checkout@v5

      # tests/test_storage.py uses real S3 storage. Not a `services:` entry, because SeaweedFS needs a
      # start command (`mini ... -bucket=`), and services can't be given one.
      - name: Start S3 storage (SeaweedFS)
        working-directory: .
        run: |
          docker run -d --name storage -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
            chrislusf/seaweedfs:4.50 mini -dir=/data -bucket=ai-coach-test
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8333/healthz && exit 0
            sleep 2
          done
          docker logs storage
          exit 1

      # The audio tests turn generated recordings into WAV with ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # uv, plus a cache of downloaded packages keyed on uv.lock: later runs skip the downloads.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Check formatting (ruff format)
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # `next typegen` first: types like LayoutProps are generated by Next into .next/, which a fresh
      # checkout doesn't have. On my PC `npm run dev` had made them, so tsc alone passed there.
      - name: Type-check (tsc)
        run: npm run typecheck

      # Not in the plan's list, but the Docker image and Vercel both run it, and it catches errors
      # that lint and tsc don't (such as a page that fails to render at build time).
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
