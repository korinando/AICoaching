[project]
name = "mock-interview-coach-backend"
version = "0.1.0"
description = "AI Mock Interview Coach - backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.123",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "piper-tts>=1.8.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "rq>=3.0.0",
    "sentry-sdk>=2.74.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

# NVIDIA's CUDA libraries, for WHISPER_DEVICE=cuda on my Windows laptop (about 1 GB). Windows
# only: Docker, Railway and CI run Linux with no GPU, so they never download them.
gpu = [
    "nvidia-cublas-cu12>=12.4,<12.9.3; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]

[tool.uv]
# `uv sync` installs both groups, so it never removes the GPU libraries again. The Dockerfile's
# `--no-dev` skips dev only; gpu is skipped there by its Windows-only marker.
default-groups = ["dev", "gpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
