[project]
name = "mock-interview-coach-backend"
version = "0.1.0"
description = "AI Mock Interview Coach - backend"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.33.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
