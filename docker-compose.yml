services:
  db:
    image: postgres:17
    restart: unless-stopped # back by itself when Docker starts, unless I stopped it
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible storage for recordings. The plan said MinIO, but its images no longer
  # exist. Code only uses the S3 API, so this can be swapped by changing a URL.
  storage:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    # mini = all parts in one process, for development. -bucket creates them at startup.
    command: mini -dir=/data -bucket=ai-coach-recordings,ai-coach-test
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      # 127.0.0.1: reachable from this PC only, not from other devices on the network.
      - "127.0.0.1:8333:8333" # S3 API
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The job queue. 127.0.0.1: reachable from this PC only, because it has no password.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data # jobs survive a restart
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runs jobs from the queue, such as scoring an interview.
  worker:
    build: ./backend
    restart: unless-stopped
    command: rq worker reports --url redis://redis:6379/0
    env_file: ./backend/.env
    environment:
      # Inside Docker, services reach each other by name and on their own ports. These replace the
      # .env values, which are for programs running directly on the PC.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://storage:8333
    volumes:
      - ./backend/app:/app/app:ro # each job loads the current code, without rebuilding the image
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  seaweeddata:
