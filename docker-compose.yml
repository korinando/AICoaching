# Settings shared by the API and the worker (an "&anchor" here, reused below as "*anchor").
# Inside Docker, services reach each other by name and on their own ports. These replace the .env
# values, which are for programs running directly on the PC.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://storage:8333
  # Models the PC has downloaded. Never downloaded inside Docker: that fails with a certificate
  # error here, and checking certificates must stay on.
  WHISPER_MODELS_DIR: /models
  HF_HUB_OFFLINE: "1"

services:
  db:
    image: postgres:17
    restart: unless-stopped # back by itself when Docker starts, unless I stopped it
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible storage for recordings. The plan said MinIO, but its images no longer
  # exist. Code only uses the S3 API, so this can be swapped by changing a URL.
  storage:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    # mini = all parts in one process, for development. -bucket creates them at startup.
    command: mini -dir=/data -bucket=ai-coach-recordings,ai-coach-test
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      # 127.0.0.1: reachable from this PC only, not from other devices on the network.
      - "127.0.0.1:8333:8333" # S3 API
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The job queue. 127.0.0.1: reachable from this PC only, because it has no password.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data # jobs survive a restart
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runs jobs from the queue, such as scoring an interview. The same image as the API (Week 7), with
  # a different command.
  worker:
    build: ./backend
    image: ai-coach-backend # one image, shared with the API
    restart: unless-stopped
    # Our start script: rq plus production logs and Sentry. REDIS_URL comes from *backend-env.
    command: python -m app.workers.main
    env_file: ./backend/.env
    environment: *backend-env
    volumes:
      - ./backend/app:/app/app:ro # each job loads the current code, without rebuilding the image
      - ./backend/whisper_models:/models:ro
    depends_on: &backend-needs
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

  # The API and the website in Docker too (Week 7). Only with --profile app, because day to day I run
  # both on the PC (uvicorn --reload, npm run dev), and they'd fight over ports 8000 and 3000:
  #   docker compose --profile app up -d --build
  api:
    profiles: [app]
    build: ./backend
    image: ai-coach-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/whisper_models:/models:ro
      - ./backend/voices:/app/voices:ro
    depends_on: *backend-needs
    healthcheck:
      # The slim image has no curl, so Python asks /health/ready, which also checks the database.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      args:
        # The address the *browser* uses, so localhost, not the service name "api".
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  seaweeddata:
